name: Release

# On a version tag: test, then publish @btoon/js to npm with provenance.
# Auth: npm trusted publishing once it's configured on npmjs.com (repository
# BTOON-project/btoon-javascript, workflow release.yml, environment "npm"), otherwise
# the NPM_TOKEN repository secret. Run it by hand to test without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write   # provenance and trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm install -g npm@11   # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm publish --provenance --access public   # prepack builds dist/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
